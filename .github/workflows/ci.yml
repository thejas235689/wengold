name: CI

# The repository has claimed a passing test count since v0.5 and nothing has ever
# proved it on push. This workflow is the proof: every push and pull request runs
# the full suite on the Python the project targets.
#
# It also pins the dependency that is easiest to be wrong about. Without
# `z3-solver` the formal engine returns `unknown` instead of `proof`/`fail`, and
# eight soundness tests fail in a way that looks like a broken kernel rather than a
# missing package. Installing it explicitly means CI reports the real state.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # one system was not a matrix: a macOS-only breakage or a 3.11 syntax
        # regression could not be seen.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyslang is the SystemVerilog front-end; z3 is the formal engine.
          # Both are load-bearing: without them large parts of the suite fail for
          # reasons that have nothing to do with the code under test.
          #
          # Pinned to the versions the suite was measured against. An unpinned
          # pyslang is a moving API, and a green local run plus a red CI run is
          # the least useful signal a project can produce.
          pip install "pytest>=8,<9" "z3-solver>=4.13,<6" "numpy>=1.26,<3" "PyYAML>=6,<7"
          pip install "pyslang==12.1.0" || echo "::warning::pyslang unavailable on ${{ matrix.os }}; front-end tests will skip"
          # the native desktop app; optional at runtime, so the suite skips its
          # tests if this ever fails, but installed here so CI covers it
          pip install "PyQt6>=6.6,<7" || echo "PyQt6 unavailable; native tests will skip"
          # GHDL's LLVM backend refuses to start without `cc`. Runners usually have
          # one; this makes sure the VHDL tests run either way, because a test that
          # silently skips is a test that stops protecting anything.
          pip install "ziglang" || echo "ziglang unavailable; VHDL tests will skip"

      - name: Show what was installed
        run: |
          python -c "import sys; print('python', sys.version)"
          python -c "import pyslang; print('pyslang', pyslang.__version__)"
          python -c "import z3; print('z3', z3.get_version_string())"

      - name: Run the test suite
        env:
          # Qt segfaults at exit without a display; the native tests set this
          # themselves, but setting it here too means a test that imports Qt
          # directly cannot crash the runner.
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q -p no:cacheprovider tests --tb=short -rf

      - name: Give GHDL a C compiler
        if: runner.os == 'Linux'
        # neorv32 analyses 54 of 54 VHDL units once GHDL can start. Without `cc` it
        # reports "installation problem" and reads as a broken toolchain.
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc already present: $(command -v cc)"
            exit 0
          fi
          sh tools/cc-shim.sh "$RUNNER_TEMP/ccbin"
          echo "$RUNNER_TEMP/ccbin" >> "$GITHUB_PATH"

      - name: Check GHDL starts and analyses a VHDL unit
        if: runner.os == 'Linux'
        run: |
          if ! command -v ghdl >/dev/null 2>&1; then
            echo "ghdl not installed on this runner — skipping"
            exit 0
          fi
          ghdl --version | head -1
          python -m pytest -q -p no:cacheprovider tests/test_vhdl.py -v

      - name: Render the native window offscreen
        # Qt renders without a display, so the real desktop window can be built and
        # screenshotted on a headless runner. This catches a window that fails to
        # construct, and a picture proves the layout came out.
        #
        # Skips rather than fails when Qt is not installable on the runner: PyQt6 is
        # an optional dependency, and a red CI over an optional extra says nothing
        # about the code under test.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if ! python -c "import PyQt6.QtWidgets" 2>/dev/null; then
            echo "PyQt6 not available on this runner — skipping the native render"
            exit 0
          fi
          python -m wengold.native examples --screenshot native.png
          python -c "
          import struct
          data = open('native.png','rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          w, h = struct.unpack('>II', data[16:24])
          print(f'native window rendered {w}x{h}')
          assert w > 800 and h > 500, (w, h)
          "

      - name: Install and uninstall the Linux app
        if: runner.os == 'Linux'
        # The installer is a shell script, so nothing above exercises it. This runs
        # it for real into a throwaway HOME and then removes it again.
        run: |
          export HOME=/tmp/fakehome && mkdir -p "$HOME"
          sh linux/install.sh
          test -x "$HOME/.local/bin/wengold"
          test -f "$HOME/.local/share/applications/wengold.desktop"
          PYTHONPATH="$HOME/.local/share/wengold" python3 -c "import wengold; print('installed', wengold.__version__)"
          sh linux/uninstall.sh
          test ! -e "$HOME/.local/bin/wengold"

      - name: Build the Debian package
        if: runner.os == 'Linux'
        run: |
          sh linux/build-deb.sh
          dpkg-deb --info dist/wengold_*_all.deb | head -12
          dpkg-deb -c dist/wengold_*_all.deb | grep -c '^' || true

      - name: Upload the Debian package
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wengold-deb
          path: dist/*.deb
          if-no-files-found: warn

      - name: Upload the native screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window
          path: native.png
          if-no-files-found: warn

      - name: Upload the pytest log
        # so a failure can be read without guessing, including from outside CI
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: /tmp/pytest.log
          if-no-files-found: warn

      - name: Check the CLI starts and reports its version
        run: |
          python -m wengold.cli --help > /dev/null
          python -c "import wengold; print('wengold', wengold.__version__)"

      - name: Index a design end to end
        run: python -m wengold.cli index examples

      - name: Check the CDC standard collateral
        run: |
          python -m wengold.cli cdc examples/cdc/mixed_clocks.sv \
            --standard examples/cdc/mixed_clocks_cdc.tcl

      - name: Emit and parse CDC assertions
        run: |
          python -m wengold.cli cdc examples/cdc/mixed_clocks.sv \
            --standard examples/cdc/mixed_clocks_cdc.tcl --sva checks.sv
          python -c "
          import pyslang
          tree = pyslang.syntax.SyntaxTree.fromText(open('checks.sv').read())
          errs = [d for d in tree.diagnostics if d.isError()]
          assert not errs, [str(e) for e in errs[:3]]
          print('generated SVA parses cleanly')
          "

  # ---------------------------------------------------------------------------
  # The zero-install claim: Python 3.11+ and nothing else.
  # ---------------------------------------------------------------------------
  no-dependencies:
    name: runs with no packages / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove nothing third-party is installed
        shell: bash
        run: |
          # If these are present the job would pass for the wrong reason.
          for m in pyslang z3 numpy PyQt6; do
            if python -c "import $m" 2>/dev/null; then
              echo "::error::$m is installed on a clean runner"
              exit 1
            fi
          done
      - name: Run the CLI with nothing installed
        shell: bash
        run: |
          sh wengold.sh --version
          sh wengold.sh doctor
          sh wengold.sh index examples/soc_top

  # ---------------------------------------------------------------------------
  # The installer: write it, use it, uninstall it.
  # ---------------------------------------------------------------------------
  install:
    name: install / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install for the current user, with no root
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          sh linux/install.sh
          test -x "$HOME/.local/bin/wengold" || { echo "::error::no launcher"; exit 1; }
      - name: The launcher answers as the CLI
        run: |
          export HOME="$RUNNER_TEMP/home"
          "$HOME/.local/bin/wengold" --version
          # a subcommand must work through the launcher, not open a window
          "$HOME/.local/bin/wengold" cdc --help >/dev/null
      - name: The IDE server starts from the installed copy and answers
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home"
          # port 0 would bind a random port, so pin one and read the URL the
          # server prints. A server that starts but does not answer is not
          # working, and `|| true` here would hide exactly that.
          PYTHONUNBUFFERED=1 "$HOME/.local/bin/wengold" ide examples/soc_top --serve \
              --port 8731 --no-browser > "$RUNNER_TEMP/ide.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            grep -q "WENGOLD IDE" "$RUNNER_TEMP/ide.log" && break
            sleep 1
          done
          cat "$RUNNER_TEMP/ide.log"
          grep -q "127.0.0.1:8731" "$RUNNER_TEMP/ide.log" \
            || { echo "::error::the IDE server did not print its URL"; exit 1; }
          curl -sf --max-time 5 http://127.0.0.1:8731/ >/dev/null \
            || { echo "::error::the IDE page did not serve"; kill "$pid" || true; exit 1; }
          kill "$pid" 2>/dev/null || true
          echo "the IDE served a page from the installed copy"
      - name: Uninstall removes exactly what it wrote
        run: |
          export HOME="$RUNNER_TEMP/home"
          sh linux/uninstall.sh
          test ! -e "$HOME/.local/share/wengold" || { echo "::error::left behind"; exit 1; }

  # ---------------------------------------------------------------------------
  # An old interpreter must be refused with the fix named.
  # ---------------------------------------------------------------------------
  old-python:
    name: refuses Python 3.9 clearly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate a 3.9 interpreter
        shell: bash
        run: |
          # wengold.sh tries 3.13, 3.12, 3.11 then python3, so shadowing only
          # python3 leaves a good interpreter reachable and this passes for the
          # wrong reason.
          shim="$RUNNER_TEMP/oldpy"; mkdir -p "$shim"
          real="$(command -v python3.12 || command -v python3)"
          for cand in python3.13 python3.12 python3.11 python3; do
            printf '#!/bin/sh\ncase "$2" in\n  *"version_info >= (3,11)"*) exit 1 ;;\n  *"version_info[:2]"*) echo "3.9"; exit 0 ;;\nesac\nexec %s "$@"\n' "$real" > "$shim/$cand"
            chmod +x "$shim/$cand"
          done
          set +e
          out=$(PATH="$shim:$PATH" sh wengold.sh --version 2>&1); rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0 || { echo "::error::3.9 must be refused"; exit 1; }
          echo "$out" | grep -q "needs Python 3.11" || { echo "::error::name the version"; exit 1; }
