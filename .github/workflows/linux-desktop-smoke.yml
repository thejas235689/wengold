name: Linux Native Desktop Smoke

on:
  push:
    branches: [main]
    paths:
      - 'wengold/native.py'
      - 'wengold/native_health.py'
      - 'wengold/project_scan.py'
      - 'wengold/desktop.py'
      - 'tests/test_project_scan.py'
      - 'wengold/native_ai.py'
      - 'wengold/ai_workbench.py'
      - 'wengold/eda_flows.py'
      - 'tests/test_eda_flows.py'
      - 'wengold/ai_prompts.py'
      - 'tests/test_ai_workbench.py'
      - 'wengold/native_ciw.py'
      - 'tests/test_native_app.py'
      - 'wengold/native_studio.py'
      - 'wengold/native_dv_pipeline.py'
      - 'wengold/dv_pipeline.py'
      - 'tests/test_dv_pipeline.py'
      - 'wengold/native_implementation.py'
      - 'wengold/synthesis_tools.py'
      - 'wengold/native_schematic.py'
      - 'wengold/schematic_graph.py'
      - 'tests/test_schematic_graph.py'
      - 'tests/test_synthesis_tools.py'
      - 'wengold/native_waveplot.py'
      - 'wengold/native_wave_debug.py'
      - 'wengold/wave_debug.py'
      - 'wengold/wave.py'
      - 'tests/test_wave_debug.py'
      - 'wengold/studio_jobs.py'
      - 'wengold/studio_durable.py'
      - 'wengold/studio_attest.py'
      - 'wengold/studio_workspace.py'
      - 'wengold/studio_ui.py'
      - 'wengold/studio_milestone_ui.py'
      - 'tests/test_native_studio.py'
      - 'tests/test_studio_milestone.py'
      - 'linux/**'
      - 'pyproject.toml'
      - '.github/workflows/linux-desktop-smoke.yml'
  workflow_dispatch:

jobs:
  linux-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 iverilog yosys
      - name: Install strict desktop test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[native,formal,slang,dev]'
          python -m pip install 'cryptography>=42'
          python -c 'import PyQt6.QtWidgets; import pyslang; import z3'
      - name: Compile native desktop sources
        run: |
          python -m compileall -q wengold/native.py wengold/native_health.py wengold/native_ai.py wengold/ai_workbench.py wengold/eda_flows.py wengold/ai_prompts.py wengold/native_ciw.py wengold/native_studio.py wengold/native_dv_pipeline.py wengold/dv_pipeline.py wengold/native_implementation.py wengold/synthesis_tools.py wengold/native_schematic.py wengold/schematic_graph.py wengold/native_waveplot.py wengold/native_wave_debug.py wengold/wave_debug.py wengold/studio_jobs.py wengold/studio_durable.py wengold/studio_attest.py
      - name: Test native app and evidence pipeline
        run: |
          python -m pytest -q tests/test_eda_flows.py tests/test_ai_workbench.py tests/test_native_studio.py tests/test_native_app.py tests/test_studio_milestone.py tests/test_studio_workspace.py tests/test_studio_durable.py tests/test_project_scan.py tests/test_dv_pipeline.py tests/test_synthesis_tools.py tests/test_schematic_graph.py tests/test_wave.py tests/test_wave_debug.py
      - name: Render full Linux desktop
        run: |
          python -m wengold.native examples --screenshot linux-studio.png
          python -c "from pathlib import Path; p=Path('linux-studio.png'); assert p.is_file() and p.stat().st_size>10000, 'screenshot missing or empty'"
      - name: Validate installer launcher collision and paths with spaces
        run: |
          sh -n linux/install.sh
          mkdir -p "$RUNNER_TEMP/wengold collision/bin/wengold"
          if sh linux/install.sh --prefix "$RUNNER_TEMP/wengold collision" > "$RUNNER_TEMP/collision.log" 2>&1; then
            echo 'Directory collision should be rejected'
            exit 1
          fi
          grep -q 'is a DIRECTORY' "$RUNNER_TEMP/collision.log"
          rmdir "$RUNNER_TEMP/wengold collision/bin/wengold"
          sh linux/install.sh --prefix "$RUNNER_TEMP/wengold collision"
          "$RUNNER_TEMP/wengold collision/bin/wengold" --version
          grep -q 'desktop --native' "$RUNNER_TEMP/wengold collision/share/applications/wengold.desktop"
          sh linux/uninstall.sh --prefix "$RUNNER_TEMP/wengold collision"
      - name: Verify per-user Linux installation
        run: |
          mkdir -p "$RUNNER_TEMP/wengold-home"
          HOME="$RUNNER_TEMP/wengold-home" sh linux/install.sh
          test -x "$RUNNER_TEMP/wengold-home/.local/bin/wengold"
          grep -q -- '--native' "$RUNNER_TEMP/wengold-home/.local/share/applications/wengold.desktop"
      - name: Verify complete isolated desktop installation from a clean HOME
        run: |
          export HOME="$RUNNER_TEMP/wengold-fresh-home"
          mkdir -p "$HOME"
          sh linux/install-desktop.sh
          test -x "$HOME/.local/share/wengold-venv/bin/python"
          test -x "$HOME/.local/bin/wengold"
          "$HOME/.local/bin/wengold" --version
          "$HOME/.local/share/wengold-venv/bin/python" -c "import PyQt6.QtWidgets, pyslang, numpy"
          test -f "$HOME/.local/share/applications/wengold.desktop"
          grep -q -- 'desktop --native' "$HOME/.local/share/applications/wengold.desktop"
          (
            cd "$RUNNER_TEMP"
            export PYTHONPATH="$HOME/.local/share/wengold"
            QT_QPA_PLATFORM=offscreen "$HOME/.local/share/wengold-venv/bin/python" \
              -m wengold.native "$GITHUB_WORKSPACE/examples" \
              --screenshot "$GITHUB_WORKSPACE/installed-linux-studio.png"
          )
          test -s installed-linux-studio.png
          sh linux/uninstall.sh
          test ! -e "$HOME/.local/share/wengold-venv"
          test ! -e "$HOME/.local/bin/wengold"
      - name: Upload installed Linux screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-installed-studio
          path: installed-linux-studio.png
          if-no-files-found: warn
      - name: Upload Linux window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-silicon-studio
          path: linux-studio.png
          if-no-files-found: warn
