name: Quantum Studio Smoke

on:
  pull_request:
    paths:
      - 'quantum/**'
      - 'quantum_app.py'
      - 'wengold/native_studio.py'
      - 'pyproject.toml'
      - 'tests/test_quantum_*.py'
      - '.github/workflows/quantum-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'quantum/**'
      - 'quantum_app.py'
      - 'wengold/native_studio.py'
      - 'pyproject.toml'
      - 'tests/test_quantum_*.py'
      - '.github/workflows/quantum-smoke.yml'

permissions:
  contents: read

jobs:
  quantum-core-and-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[native,dev]'
      - run: python -m pip install pytest-qt
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_quantum_ir.py tests/test_quantum_editor.py

  simulator-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,quantum]'
      - run: python -m pytest -q tests/test_quantum_ir.py tests/test_quantum_backends.py
