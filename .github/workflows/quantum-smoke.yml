name: Quantum Studio Smoke

on:
  pull_request:
    paths:
      - 'quantum/**'
      - 'quantum_app.py'
      - 'wengold/native_studio.py'
      - 'pyproject.toml'
      - 'tests/test_quantum_*.py'
      - '.github/workflows/quantum-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'quantum/**'
      - 'quantum_app.py'
      - 'wengold/native_studio.py'
      - 'pyproject.toml'
      - 'tests/test_quantum_*.py'
      - '.github/workflows/quantum-smoke.yml'

permissions:
  contents: read

jobs:
  quantum-core-and-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[native,dev]'
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_quantum_ir.py tests/test_quantum_editor.py tests/test_quantum_openqasm3.py

  simulator-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,quantum]'
      - run: python -m pytest -q tests/test_quantum_ir.py tests/test_quantum_backends.py tests/test_quantum_openqasm3.py tests/test_quantum_quest_bridge.py

  quest-native-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: lukka/get-cmake@latest
      - name: Install WENGOLD quantum and native build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,quantum,quantum-native]'
      - name: Build and install QuEST v4.2.0 CPU library
        run: |
          git clone --depth 1 --branch v4.2.0 https://github.com/QuEST-Kit/QuEST.git "$RUNNER_TEMP/QuEST"
          cmake -S "$RUNNER_TEMP/QuEST" -B "$RUNNER_TEMP/quest-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/quest-prefix"
          cmake --build "$RUNNER_TEMP/quest-build" --parallel 2
          cmake --install "$RUNNER_TEMP/quest-build"
      - name: Build WENGOLD pybind11 bridge
        run: |
          cmake -S quantum/native -B build/quest-bridge -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/quest-prefix/quest" -DCMAKE_INCLUDE_PATH="$RUNNER_TEMP/quest-prefix/quest/include" -DCMAKE_LIBRARY_PATH="$RUNNER_TEMP/quest-prefix/quest/lib"
          cmake --build build/quest-bridge --parallel 2
          cmake --install build/quest-bridge --prefix "$GITHUB_WORKSPACE"
      - name: Test QuEST CPU backend against Bell and bit-order reference
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/quest-prefix/quest/lib
        run: python -m pytest -q tests/test_quantum_quest_bridge.py
