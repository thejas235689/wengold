name: Waveform Differential Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/otel-traffic-debug-observability"]
  workflow_dispatch:

jobs:
  wave-diff:
    name: PASS/FAIL VCD differential tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install "pytest>=8,<9"
      - name: Run waveform differential tests
        run: python -m pytest -q tests/test_wave_diff.py
