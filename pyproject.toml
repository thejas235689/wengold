[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wengold"
version = "0.1.0"
description = "The open-source validity kernel for silicon verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The WENGOLD Authors" }]
dependencies = ["pydantic>=2.5", "networkx>=3.2", "rich>=13.0", "typer>=0.12"]

[project.optional-dependencies]
open = ["cocotb>=1.8", "cocotb-coverage>=1.2"]
mcp  = ["mcp>=1.0"]
dev  = ["pytest>=8.0", "pytest-cov", "ruff"]

[project.scripts]
wengold = "wengold.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
