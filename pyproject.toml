[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wengold"
version = "0.50.1"
description = "The open-source validity kernel for silicon verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "The WENGOLD Authors" }]
# The graph, the kernel, the front-ends and the CLI are standard library only.
# numpy is needed by `wengold learn` and `wengold spec-from-text` — the autodiff
# tape behind the transformer — and by nothing else.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# the native desktop app. Optional: `wengold desktop`
# falls back to a browser window without it.
native = ["PyQt6>=6.6,<7"]
open = ["cocotb>=1.8", "cocotb-coverage>=1.2"]
formal = ["z3-solver>=4.12"]   # optional symbolic backend
slang = ["pyslang>=9"]         # optional real SystemVerilog front-end
spec = ["PyYAML>=6.0"]          # YAML specs (JSON needs nothing extra)
all = ["z3-solver>=4.12", "pyslang>=9", "cocotb>=1.8", "PyYAML>=6.0"]
dev  = ["pytest>=8.0", "pytest-cov", "PyYAML>=6.0"]

[project.scripts]
wengold = "wengold.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
