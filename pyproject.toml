[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wengold"
version = "0.5.1"
description = "The open-source validity kernel for silicon verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "The WENGOLD Authors" }]
# The core is standard-library only: no runtime dependencies.
dependencies = []

[project.optional-dependencies]
open = ["cocotb>=1.8", "cocotb-coverage>=1.2"]
formal = ["z3-solver>=4.12"]   # optional symbolic backend
slang = ["pyslang>=9"]         # optional real SystemVerilog front-end
all = ["z3-solver>=4.12", "pyslang>=9", "cocotb>=1.8"]
dev  = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
wengold = "wengold.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
